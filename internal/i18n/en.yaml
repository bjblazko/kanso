about.title: "About Kanso"
about.what: "One place for what a family or a small team knows and plans: wiki, notes, to-dos, tasks, recipes, shopping lists and meal plans – as files in a Git directory, readable without Kanso."
about.license: "Licence"
about.where: "What Kanso sends where"
about.where_text: "Kanso sends no telemetry and checks for no updates. It talks to the sign-in service, fetches the profile picture once per sign-in, fetches recipe pages and their photos when someone uses “From web page”, and sends text to the registered AI only for functions marked “AI”. Everything else stays on this server."
