about.title: "Über Kanso"
about.what: "Ein Ort für das, was eine Familie oder ein kleines Team weiß und vorhat: Wiki, Notizen, Todos, Aufgaben, Rezepte, Einkaufslisten und Kochpläne – als Dateien in einem Git-Verzeichnis, lesbar auch ohne Kanso."
about.license: "Lizenz"
about.where: "Was Kanso wohin schickt"
about.where_text: "Kanso sendet keine Telemetrie und sucht nicht nach Updates. Es spricht mit dem Anmeldedienst, holt einmal pro Anmeldung das Profilbild, ruft Rezeptseiten und ihre Fotos ab, wenn jemand „Von Webseite“ nutzt, und schickt Text an die eingetragene KI nur bei Funktionen mit dem Zeichen „KI“. Alles andere bleibt auf diesem Server."
