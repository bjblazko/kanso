{{define "content"}}{{$d := .Data}}<div class="content">
<h1>{{.T "page.delete_confirm" $d.Page.Meta.Title}}</h1>
<p>{{.T "page.delete_hint"}}</p>
<form method="post" action="/p/{{$d.Page.Meta.ID}}/delete" class="actions">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <button class="btn btn-destructive" type="submit">{{.T "page.delete_named" $d.Page.Meta.Title}}</button>
  <a class="btn btn-secondary" href="/p/{{$d.Page.Meta.ID}}">{{.T "action.cancel"}}</a>
</form>
</div>{{end}}
