{{define "content"}}{{$d := .Data}}<div class="editor-page">
<form method="post" action="/p/{{$d.Page.Meta.ID}}" class="editor" id="editor"
      data-save-url="/p/{{$d.Page.Meta.ID}}" data-view-url="/p/{{$d.Page.Meta.ID}}" data-upload-url="/p/{{$d.Page.Meta.ID}}/attachments"
      data-preview-key="page" data-preview-id="{{$d.Page.Meta.ID}}" data-msg-lost="{{.T "page.lock_lost"}}" data-msg-failed="{{.T "page.save_failed"}}"
      data-msg-upload-failed="{{.T "editor.upload_failed"}}" data-msg-leave="{{.T "editor.unsaved"}}">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="lock" value="{{$d.Lock}}">
  <input type="hidden" name="release" value="1">
  <div class="field">
    <label for="title">{{.T "page.title"}}</label>
    <input id="title" name="title" required maxlength="200" value="{{$d.Page.Meta.Title}}">
  </div>
  <input type="hidden" name="meta" value="1">
  <div class="field"><label for="tags">{{.T "recipe.tags"}}</label>
    <input id="tags" name="tags" value="{{$d.TagsText}}" maxlength="300" aria-describedby="tags-hint">
    <span class="hint" id="tags-hint">{{.T "recipe.tags_hint"}}</span></div>
  <div class="field field-check"><label><input type="checkbox" id="recipe" name="recipe" value="1"{{if $d.Page.Meta.IsRecipe}} checked{{end}}> {{.T "recipe.is_recipe"}}</label></div>
  <fieldset class="recipe-fields">
    <legend class="visually-hidden">{{.T "recipe.fields"}}</legend>
    <div class="field"><label for="servings">{{.T "recipe.servings"}}</label>
      <input id="servings" name="servings" value="{{with $d.Page.Meta.Servings}}{{.}}{{end}}" type="number" min="1" max="99" inputmode="numeric"></div>
    <div class="field"><label for="time">{{.T "recipe.time"}}</label>
      <input id="time" name="time" value="{{with $d.Page.Meta.Time}}{{.}}{{end}}" type="number" min="0" inputmode="numeric"></div>
    <div class="field field-wide"><label for="source">{{.T "recipe.source"}}</label>
      <input id="source" name="source" maxlength="500" value="{{$d.Page.Meta.Source}}"></div>
  </fieldset>
  <div class="seg seg-quiet editor-tabs" role="tablist" aria-label="{{.T "editor.view"}}">
    <button type="button" role="tab" id="tab-source" aria-controls="pane-source" aria-selected="true" aria-pressed="true">{{.T "editor.source"}}</button>
    <button type="button" role="tab" id="tab-preview" aria-controls="preview" aria-selected="false" aria-pressed="false">{{.T "editor.preview"}}</button>
  </div>
  <div class="editor-panes" data-show="source">
    <div class="field pane-source" id="pane-source" role="tabpanel" aria-labelledby="tab-source">
      <label for="body">{{.T "editor.source"}}</label>
      <textarea id="body" name="body" rows="24" spellcheck="true">{{$d.Page.Body}}</textarea>
      <div class="upload">
        <label class="btn btn-quiet btn-sm" for="file">{{.T "editor.attach"}}</label>
        <input class="visually-hidden" type="file" id="file" multiple>
        <span class="hint">{{.T "editor.attach_hint"}}</span>
      </div>
    </div>
    <div class="pane-preview" role="tabpanel" aria-labelledby="tab-preview" aria-live="polite">
      <span class="pane-label" aria-hidden="true">{{.T "editor.preview"}}</span>
      <div class="prose" id="preview"></div>
    </div>
  </div>
  <p class="notice notice-warning" id="editor-status" role="alert" hidden></p>
  <div class="actions">
    <button class="btn btn-primary" type="submit">{{.T "page.save"}}</button>
    <a class="btn btn-quiet" href="/p/{{$d.Page.Meta.ID}}">{{.T "action.cancel"}}</a>
    <span class="hint">{{.T "editor.shortcut"}}</span>
  </div>
</form>
</div>{{end}}
{{define "scripts"}}<script type="module" src="{{.Asset "js/mermaid-loader.js"}}" data-mermaid-src="{{.Asset "vendor/mermaid/mermaid.esm.min.mjs"}}"></script>
<script type="module" src="{{.Asset "js/editor.js"}}"></script>{{end}}
