{{define "content"}}{{$d := .Data}}<div class="content">
<h1>{{.Title}}</h1>
<form method="post" action="/mealplan/{{$d.Plan.ID}}/remove" class="form">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="week" value="{{$d.Week}}">
  <input type="hidden" name="entry" value="{{$d.Entry.ID}}">
  {{if $d.ListName}}<p>{{.T "plan.remove_shopped" $d.ListName}}</p>
  <div class="actions"><button class="btn btn-primary" type="submit" name="subtract" value="1">{{.T "plan.remove_subtract"}}</button>
    <button class="btn btn-secondary" type="submit">{{.T "plan.remove_only"}}</button>
    <a class="btn btn-quiet" href="/mealplan/{{$d.Plan.ID}}?week={{$d.Week}}">{{.T "action.cancel"}}</a></div>
  {{else}}<div class="actions"><button class="btn btn-destructive" type="submit">{{.T "plan.remove_only"}}</button>
    <a class="btn btn-quiet" href="/mealplan/{{$d.Plan.ID}}?week={{$d.Week}}">{{.T "action.cancel"}}</a></div>{{end}}
</form>
</div>{{end}}
